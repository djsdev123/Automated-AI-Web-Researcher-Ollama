version: '3.8'

services:
  researcher-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    stdin_open: true
    tty: true

    volumes:
      - ..:/workspace:cached

    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=phi3:3.8b-mini-128k-instruct
      - LLM_PROVIDER=ollama
      - LOG_LEVEL=DEBUG
      - CONFIG_PATH=/workspace/config/config.yaml

    command: sleep infinity

volumes:
  vscode-extensions:
  vscode-extensions-insiders:
