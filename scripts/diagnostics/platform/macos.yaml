# macOS-Specific Diagnostic Checks
# Imported by main rules.yaml for macOS systems only

checks:
  - name: docker-desktop-app-running
    description: Check Docker Desktop.app is running
    type: command
    platforms: macos
    severity: critical
    parameters:
      command: "pgrep -f 'Docker Desktop' >/dev/null"
      timeout: 5

  - name: rosetta-check
    description: Check if running on Apple Silicon with Rosetta
    type: command
    platforms: macos
    severity: info
    parameters:
      command: "uname -m"
      expect: ""  # Just check it runs
      timeout: 5

  - name: docker-socket-accessible
    description: Check Docker socket is accessible
    type: file_exists
    platforms: macos
    severity: critical
    parameters:
      filepath: "/var/run/docker.sock"

fixes:
  docker-desktop-app-running:
    - "Open Docker Desktop from Applications folder"
    - "Or via Spotlight: Cmd+Space, type 'Docker'"
    - "Wait for whale icon in menu bar to be solid (not animated)"

  docker-socket-accessible:
    - "Docker Desktop may not be fully started"
    - "Restart Docker Desktop"
    - "Check Docker Desktop > Troubleshoot > Reset to Factory Defaults if persists"
