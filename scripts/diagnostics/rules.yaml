# Diagnostic Rules - Single Source of Truth for All Checks
# This YAML file defines ALL diagnostic checks
# NO checks are hardcoded - everything is data-driven

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
settings:
  timeout_default: 30
  stop_on_critical_failure: false
  parallel_execution: false

# =============================================================================
# DIAGNOSTIC CHECKS
# =============================================================================
# Each check has:
#   - name: Unique identifier
#   - description: Human-readable explanation
#   - type: command | file_exists | url_reachable | port_available | env_var
#   - platforms: all | macos | linux | windows (comma-separated)
#   - severity: critical | warning | info
#   - parameters: Type-specific parameters

checks:
  # ---------------------------------------------------------------------------
  # Docker Checks
  # ---------------------------------------------------------------------------
  - name: docker-installed
    description: Check if Docker is installed
    type: command
    platforms: all
    severity: critical
    parameters:
      command: "docker --version"
      expect: "Docker version"
      timeout: 5

  - name: docker-running
    description: Check if Docker daemon is running
    type: command
    platforms: all
    severity: critical
    parameters:
      command: "docker info"
      expect: "Server Version"
      timeout: 10

  - name: docker-compose-installed
    description: Check if Docker Compose is available
    type: command
    platforms: all
    severity: warning
    parameters:
      command: "docker-compose --version || docker compose version"
      expect: "version"
      timeout: 5

  # ---------------------------------------------------------------------------
  # File Sharing Checks (macOS-specific)
  # ---------------------------------------------------------------------------
  - name: docker-file-sharing-macos
    description: Check Docker can access project directory
    type: command
    platforms: macos
    severity: critical
    parameters:
      command: "docker run --rm -v \"${PROJECT_ROOT}:/test\" alpine ls /test >/dev/null 2>&1"
      timeout: 15

  # ---------------------------------------------------------------------------
  # Configuration File Checks
  # ---------------------------------------------------------------------------
  - name: env-file-exists
    description: Check .env configuration file exists
    type: file_exists
    platforms: all
    severity: warning
    parameters:
      filepath: "${PROJECT_ROOT}/.env"

  - name: env-example-exists
    description: Check .env.example template exists
    type: file_exists
    platforms: all
    severity: info
    parameters:
      filepath: "${PROJECT_ROOT}/.env.example"

  - name: config-yaml-exists
    description: Check config.yaml exists
    type: file_exists
    platforms: all
    severity: warning
    parameters:
      filepath: "${PROJECT_ROOT}/config/config.yaml"

  - name: dockerfile-exists
    description: Check Dockerfile exists
    type: file_exists
    platforms: all
    severity: critical
    parameters:
      filepath: "${PROJECT_ROOT}/Dockerfile"

  - name: docker-compose-exists
    description: Check docker-compose.yml exists
    type: file_exists
    platforms: all
    severity: critical
    parameters:
      filepath: "${PROJECT_ROOT}/docker-compose.yml"

  # ---------------------------------------------------------------------------
  # Environment Variable Checks
  # ---------------------------------------------------------------------------
  - name: llm-provider-set
    description: Check LLM_PROVIDER is configured
    type: env_var
    platforms: all
    severity: warning
    parameters:
      var_name: "LLM_PROVIDER"

  - name: ollama-url-set
    description: Check OLLAMA_BASE_URL is configured
    type: env_var
    platforms: all
    severity: info
    parameters:
      var_name: "OLLAMA_BASE_URL"

  - name: ollama-model-set
    description: Check OLLAMA_MODEL is configured
    type: env_var
    platforms: all
    severity: info
    parameters:
      var_name: "OLLAMA_MODEL"

  # ---------------------------------------------------------------------------
  # Network/Service Checks
  # ---------------------------------------------------------------------------
  - name: ollama-reachable
    description: Check Ollama server is reachable
    type: url_reachable
    platforms: all
    severity: warning
    parameters:
      url: "${OLLAMA_BASE_URL:-http://localhost:11434}/api/version"
      timeout: 5

  - name: port-11434-available
    description: Check Ollama port is available or in use
    type: port_available
    platforms: all
    severity: info
    parameters:
      port: 11434

  - name: port-4000-available
    description: Check LiteLLM port is available
    type: port_available
    platforms: all
    severity: info
    parameters:
      port: 4000

  # ---------------------------------------------------------------------------
  # Python Environment Checks
  # ---------------------------------------------------------------------------
  - name: python-installed
    description: Check Python 3 is installed
    type: command
    platforms: all
    severity: critical
    parameters:
      command: "python3 --version"
      expect: "Python 3"
      timeout: 5

  - name: requirements-file-exists
    description: Check requirements.txt exists
    type: file_exists
    platforms: all
    severity: warning
    parameters:
      filepath: "${PROJECT_ROOT}/requirements.txt"

# =============================================================================
# FIX SUGGESTIONS
# =============================================================================
# Maps check names to fix instructions

fixes:
  docker-installed:
    - "Install Docker Desktop from https://docker.com"
    - "macOS: brew install --cask docker"
    - "Linux: curl -fsSL https://get.docker.com | sh"

  docker-running:
    - "Start Docker Desktop application"
    - "Wait for Docker icon to show 'running' status"
    - "Verify with: docker ps"

  docker-file-sharing-macos:
    - "Open Docker Desktop > Settings"
    - "Go to Resources > File Sharing"
    - "Add /Users to the list"
    - "Click Apply & Restart"

  env-file-exists:
    - "Copy template: cp .env.example .env"
    - "Edit .env with your settings"
    - "Set at minimum: OLLAMA_BASE_URL and OLLAMA_MODEL"

  ollama-reachable:
    - "Start Ollama: ollama serve"
    - "Or use cloud provider: set LLM_PROVIDER=openai in .env"
    - "Check Ollama URL in .env matches your setup"

  port-11434-available:
    - "Port in use is normal if Ollama is running"
    - "If not running Ollama, check what's using the port: lsof -i :11434"

  port-4000-available:
    - "Port in use might conflict with LiteLLM"
    - "Change LITELLM_PORT in .env to use different port"

  python-installed:
    - "Install Python 3.11 or later"
    - "macOS: brew install python@3.11"
    - "Linux: sudo apt install python3.11"
