version: '3.8'

services:
  researcher:
    build: .
    env_file: .env
    volumes:
      - .:/workspace
      - ./data:/app/data
      - ./logs:/app/logs
    stdin_open: true
    tty: true

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    env_file: .env
    ports: ["${LITELLM_PORT:-4000}:4000"]
    volumes:
      - litellm-data:/app
      - ./config/litellm-config.yaml:/app/config.yaml:ro

volumes:
  litellm-data:
